
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta en vivo | ZEKA-SORTEO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #172554, #080b18 65%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .logo {
      color: #38bdf8;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 43px);
      margin: 0 0 10px;
    }

    .subtitle {
      color: #a5b4fc;
      margin-bottom: 35px;
    }

    .roulette {
      width: 230px;
      height: 230px;
      margin: 0 auto 25px;
      border-radius: 50%;
      border: 8px solid #38bdf8;
      background: conic-gradient(
        #1e3a8a 0deg 45deg,
        #0f172a 45deg 90deg,
        #1d4ed8 90deg 135deg,
        #0f172a 135deg 180deg,
        #1e3a8a 180deg 225deg,
        #0f172a 225deg 270deg,
        #1d4ed8 270deg 315deg,
        #0f172a 315deg 360deg
      );
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px #0284c7aa;
      position: relative;
    }

    .roulette::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px solid #7dd3fc;
      border-radius: 50%;
    }

    .number {
      position: relative;
      z-index: 1;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: #020617;
      border: 3px solid #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      font-weight: bold;
      color: #67e8f9;
      box-shadow: 0 0 25px #0ea5e9;
    }

    .spinning {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status {
      color: #cbd5e1;
      min-height: 25px;
      margin: 20px 0;
    }

    .winners {
      display: grid;
      gap: 15px;
      margin-top: 30px;
    }

    .winner {
      padding: 22px;
      border: 1px solid #2563eb;
      border-radius: 15px;
      background: #111c35;
      opacity: 0;
      transform: translateY(15px);
      transition: .7s ease;
    }

    .winner.show {
      opacity: 1;
      transform: translateY(0);
    }

    .winner h2 {
      color: #38bdf8;
      margin: 0 0 12px;
      font-size: 18px;
    }

    .winner .winner-number {
      font-size: 38px;
      font-weight: bold;
      color: #67e8f9;
    }

    .winner .winner-name {
      font-size: 20px;
      margin-top: 8px;
    }

    .waiting {
      padding: 20px;
      border: 1px solid #334155;
      background: #111827;
      border-radius: 12px;
      color: #cbd5e1;
    }

    .error {
      color: #fca5a5;
      margin-top: 20px;
    }

    footer {
      color: #64748b;
      margin-top: 35px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">ZEKA-SORTEO</div>

    <h1>🎯 Sorteo en vivo</h1>
    <p class="subtitle">Zeka internet Ilimitado ♾️</p>

    <div class="roulette">
      <div class="number" id="number">---</div>
    </div>

    <div class="status" id="status">
      El sorteo todavía no comenzó.
    </div>

    <div class="winners" id="winners"></div>

    <div class="error" id="error"></div>

    <footer>
      Resultados oficiales del sorteo ZEKA-SORTEO
    </footer>
  </main>

  <script type="module">
    import { db } from "./firebase.js";

    import {
      doc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // El sorteo se indica con ?raffle=ID (el panel de administración arma el
    // enlace). Si falta, se usa el sorteo de ZEKA.
    const DEFAULT_RAFFLE_ID = "fHG7phVJcVHScDpuzx1B";

    const requestedId =
      new URLSearchParams(window.location.search).get("raffle");

    const RAFFLE_ID =
      requestedId && /^[A-Za-z0-9_-]{1,150}$/.test(requestedId)
        ? requestedId
        : DEFAULT_RAFFLE_ID;

    const numberDisplay = document.getElementById("number");
    const statusDisplay = document.getElementById("status");
    const winnersDisplay = document.getElementById("winners");
    const errorDisplay = document.getElementById("error");

    let animationStarted = false;

    function getWinnerNumber(winner) {
      return winner.number ??
        winner.ticketNumber ??
        winner.numero ??
        winner.ticket ??
        "---";
    }

    function getWinnerName(winner) {
      return winner.name ??
        winner.participantName ??
        winner.nombre ??
        "Participante";
    }

    function animateWinner(winner, position) {
      return new Promise((resolve) => {
        const finalNumber = String(getWinnerNumber(winner))
          .padStart(3, "0");

        statusDisplay.textContent =
          `Revelando al ganador ${position}...`;

        numberDisplay.classList.add("spinning");

        let count = 0;

        const animation = setInterval(() => {
          numberDisplay.textContent =
            String(Math.floor(Math.random() * 1000))
              .padStart(3, "0");

          count++;

          if (count >= 25) {
            clearInterval(animation);

            numberDisplay.classList.remove("spinning");
            numberDisplay.textContent = finalNumber;

            const card = document.createElement("div");
            card.className = "winner";

            const title = document.createElement("h2");
            title.textContent = `🏆 GANADOR ${position}`;

            const number = document.createElement("div");
            number.className = "winner-number";
            number.textContent = `N° ${finalNumber}`;

            const name = document.createElement("div");
            name.className = "winner-name";
            name.textContent = getWinnerName(winner);

            card.append(title, number, name);
            winnersDisplay.appendChild(card);

            requestAnimationFrame(() => {
              card.classList.add("show");
            });

            resolve();
          }
        }, 100);
      });
    }

    async function showResults(results) {
      if (animationStarted) return;

      if (!Array.isArray(results) || results.length < 1) {
        errorDisplay.textContent =
          "Los resultados guardados no tienen el formato esperado.";
        return;
      }

      animationStarted = true;
      winnersDisplay.innerHTML = "";

      statusDisplay.textContent =
        "¡El sorteo comenzó! Mucha suerte.";

      for (let i = 0; i < results.length; i++) {
        if (i > 0) {
          await new Promise(resolve => setTimeout(resolve, 1200));
        }

        await animateWinner(results[i], i + 1);
      }

      statusDisplay.textContent =
        results.length === 1
          ? "¡Sorteo finalizado! Este es el ganador oficial."
          : "¡Sorteo finalizado! Estos son los ganadores oficiales.";
    }

    const raffleRef = doc(db, "raffles", RAFFLE_ID);

    onSnapshot(
      raffleRef,
      async (snapshot) => {
        if (!snapshot.exists()) {
          statusDisplay.textContent =
            "No se encontró el sorteo.";
          return;
        }

        const raffle = snapshot.data();

        if (
          raffle.status === "drawn" &&
          Array.isArray(raffle.drawResults)
        ) {
          await showResults(raffle.drawResults);
        } else {
          statusDisplay.textContent =
            "El sorteo todavía no comenzó. Esperando el inicio oficial...";
        }
      },
      (error) => {
        console.error("Error consultando sorteo:", error);

        errorDisplay.textContent =
          "No se pudo conectar con el sorteo. Recargá la página.";
      }
    );
  </script>
</body>
</html>
