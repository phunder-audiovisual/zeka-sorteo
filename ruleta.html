
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta en vivo | ZEKA-SORTEO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #172554, #080b18 65%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .logo {
      color: #38bdf8;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 43px);
      margin: 0 0 10px;
    }

    .subtitle {
      color: #a5b4fc;
      margin-bottom: 35px;
    }

    .roulette {
      --size: min(88vw, 440px);
      width: var(--size);
      height: var(--size);
      margin: 0 auto 25px;
      border-radius: 50%;
      border: 8px solid #38bdf8;
      background: conic-gradient(
        #1e3a8a 0deg 45deg,
        #0f172a 45deg 90deg,
        #1d4ed8 90deg 135deg,
        #0f172a 135deg 180deg,
        #1e3a8a 180deg 225deg,
        #0f172a 225deg 270deg,
        #1d4ed8 270deg 315deg,
        #0f172a 315deg 360deg
      );
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px #0284c7aa;
      position: relative;
    }

    .roulette::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px solid #7dd3fc;
      border-radius: 50%;
    }

    /* Anillo con los números de todos los participantes */
    .ring {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tick-arm {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
    }

    .tick {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: bold;
      line-height: 1;
      color: #bae6fd;
      white-space: nowrap;
      padding: 2px 3px;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }

    .tick.active {
      color: #020617;
      background: #67e8f9;
      box-shadow: 0 0 12px #22d3ee;
    }

    .tick.tick-win {
      color: #422006;
      background: #facc15;
      box-shadow: 0 0 14px #facc15;
    }

    .number {
      position: relative;
      z-index: 1;
      width: 38%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #020617;
      border: 3px solid #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(26px, 9vw, 46px);
      font-weight: bold;
      color: #67e8f9;
      box-shadow: 0 0 25px #0ea5e9;
    }

    .spinning {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .ring-note {
      color: #94a3b8;
      font-size: 13px;
      min-height: 18px;
      margin: -10px 0 10px;
    }

    .status {
      color: #cbd5e1;
      min-height: 25px;
      margin: 20px 0;
    }

    .winners {
      display: grid;
      gap: 15px;
      margin-top: 30px;
    }

    .winner {
      padding: 22px;
      border: 1px solid #2563eb;
      border-radius: 15px;
      background: #111c35;
      opacity: 0;
      transform: translateY(15px);
      transition: .7s ease;
    }

    .winner.show {
      opacity: 1;
      transform: translateY(0);
    }

    .winner h2 {
      color: #38bdf8;
      margin: 0 0 12px;
      font-size: 18px;
    }

    .winner .winner-number {
      font-size: 38px;
      font-weight: bold;
      color: #67e8f9;
    }

    .winner .winner-name {
      font-size: 20px;
      margin-top: 8px;
    }

    .waiting {
      padding: 20px;
      border: 1px solid #334155;
      background: #111827;
      border-radius: 12px;
      color: #cbd5e1;
    }

    .error {
      color: #fca5a5;
      margin-top: 20px;
    }

    footer {
      color: #64748b;
      margin-top: 35px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">ZEKA-SORTEO</div>

    <h1>🎯 Sorteo en vivo</h1>
    <p class="subtitle">Zeka internet Ilimitado ♾️</p>

    <div class="roulette">
      <div class="ring" id="ring"></div>
      <div class="number" id="number">---</div>
    </div>

    <div class="ring-note" id="ringNote"></div>

    <div class="status" id="status">
      El sorteo todavía no comenzó.
    </div>

    <div class="winners" id="winners"></div>

    <div class="error" id="error"></div>

    <footer>
      Resultados oficiales del sorteo ZEKA-SORTEO
    </footer>
  </main>

  <script type="module">
    import { db, auth } from "./firebase.js";

    import {
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    import {
      doc,
      collection,
      getDocs,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // El sorteo se indica con ?raffle=ID (el panel de administración arma el
    // enlace). Si falta, se usa el sorteo de ZEKA.
    const DEFAULT_RAFFLE_ID = "fHG7phVJcVHScDpuzx1B";

    const requestedId =
      new URLSearchParams(window.location.search).get("raffle");

    const RAFFLE_ID =
      requestedId && /^[A-Za-z0-9_-]{1,150}$/.test(requestedId)
        ? requestedId
        : DEFAULT_RAFFLE_ID;

    const numberDisplay = document.getElementById("number");
    const statusDisplay = document.getElementById("status");
    const winnersDisplay = document.getElementById("winners");
    const errorDisplay = document.getElementById("error");
    const ringDisplay = document.getElementById("ring");
    const rouletteBox = document.querySelector(".roulette");
    const ringNote = document.getElementById("ringNote");

    let animationStarted = false;

    function getWinnerNumber(winner) {
      return winner.number ??
        winner.ticketNumber ??
        winner.numero ??
        winner.ticket ??
        "---";
    }

    function getWinnerName(winner) {
      return winner.name ??
        winner.participantName ??
        winner.nombre ??
        "Participante";
    }

    // ---------- Anillo de números ----------

    let ringNumbers = [];
    const tickElements = new Map();

    function padNumber(value) {
      return String(value).padStart(3, "0");
    }

    function renderRing(numbers) {
      ringNumbers = numbers;
      tickElements.clear();
      ringDisplay.innerHTML = "";

      if (numbers.length === 0) return;

      const box = rouletteBox.getBoundingClientRect();
      const size = box.width || 300;

      // Radio al que se ubican los números (cerca del borde interno).
      const radius = size * 0.5 - 8 - 22;
      const arc = (2 * Math.PI * radius) / numbers.length;
      const fontSize = Math.max(7, Math.min(16, Math.floor(arc * 0.85)));

      numbers.forEach((number, index) => {
        const angle = (360 / numbers.length) * index;

        const arm = document.createElement("div");
        arm.className = "tick-arm";
        arm.style.transform = `rotate(${angle - 90}deg)`;

        const tick = document.createElement("div");
        tick.className = "tick";
        tick.textContent = number;
        tick.style.left = `${radius}px`;
        tick.style.top = "0";
        tick.style.fontSize = `${fontSize}px`;

        arm.appendChild(tick);
        ringDisplay.appendChild(arm);
        tickElements.set(number, tick);
      });
    }

    function setActiveTick(number) {
      tickElements.forEach(tick => tick.classList.remove("active"));
      tickElements.get(number)?.classList.add("active");
    }

    function markWinnerTick(number) {
      tickElements.forEach(tick => tick.classList.remove("active"));
      tickElements.get(number)?.classList.add("tick-win");
    }

    // El sitio entra con una sesión anónima invisible, igual que la página
    // pública, para poder leer la lista de números.
    async function ensureSession() {
      try {
        await auth.authStateReady?.();

        if (!auth.currentUser) {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.warn("No se pudo abrir la sesión anónima:", error);
      }
    }

    // Números de todos los participantes (pagados) + los ganadores.
    async function loadParticipants(results = []) {
      const numbers = new Set();
      let readFailed = false;

      await ensureSession();

      try {
        const snapshot = await getDocs(
          collection(db, "raffles", RAFFLE_ID, "publicTickets")
        );

        snapshot.forEach(document => {
          const data = document.data();

          if (data.status === "occupied") {
            numbers.add(padNumber(data.number ?? document.id));
          }
        });
      } catch (error) {
        readFailed = true;
        console.warn("No se pudieron leer los participantes:", error);
      }

      // Los ganadores siempre figuran, aunque la lista pública esté desactualizada.
      results.forEach(winner => {
        numbers.add(padNumber(getWinnerNumber(winner)));
      });

      if (readFailed) {
        ringNote.textContent =
          "No se pudieron leer los números (revisá las reglas de Firestore).";
      } else if (numbers.size === 0) {
        ringNote.textContent =
          "Todavía no hay números pagados publicados. En el panel tocá «Sincronizar números públicos».";
      } else {
        ringNote.textContent =
          `${numbers.size} números participando`;
      }

      return [...numbers].sort();
    }

    async function refreshRing(results = []) {
      const numbers = await loadParticipants(results);
      renderRing(numbers);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Recorre el anillo frenando de a poco hasta caer en el ganador.
    async function sweepRing(finalNumber) {
      const total = ringNumbers.length;
      const steps = 36;
      const target = ringNumbers.indexOf(finalNumber);

      for (let i = 0; i <= steps; i++) {
        const index =
          (((target - steps + i) % total) + total) % total;

        const number = ringNumbers[index];

        setActiveTick(number);
        numberDisplay.textContent = number;

        const progress = i / steps;
        await wait(40 + 260 * progress ** 3);
      }
    }

    async function animateWinner(winner, position) {
      const finalNumber = padNumber(getWinnerNumber(winner));

      statusDisplay.textContent =
        `Revelando al ganador ${position}...`;

      if (ringNumbers.includes(finalNumber)) {
        await sweepRing(finalNumber);
      } else {
        // Sin anillo disponible: efecto de números al azar.
        for (let i = 0; i < 25; i++) {
          numberDisplay.textContent =
            String(Math.floor(Math.random() * 1000)).padStart(3, "0");
          await wait(100);
        }
      }

      numberDisplay.textContent = finalNumber;
      markWinnerTick(finalNumber);

      const card = document.createElement("div");
      card.className = "winner";

      const title = document.createElement("h2");
      title.textContent = `🏆 GANADOR ${position}`;

      const number = document.createElement("div");
      number.className = "winner-number";
      number.textContent = `N° ${finalNumber}`;

      const name = document.createElement("div");
      name.className = "winner-name";
      name.textContent = getWinnerName(winner);

      card.append(title, number, name);
      winnersDisplay.appendChild(card);

      requestAnimationFrame(() => {
        card.classList.add("show");
      });
    }

    async function showResults(results) {
      if (animationStarted) return;

      if (!Array.isArray(results) || results.length < 1) {
        errorDisplay.textContent =
          "Los resultados guardados no tienen el formato esperado.";
        return;
      }

      animationStarted = true;
      winnersDisplay.innerHTML = "";

      await refreshRing(results);

      statusDisplay.textContent =
        "¡El sorteo comenzó! Mucha suerte.";

      for (let i = 0; i < results.length; i++) {
        if (i > 0) {
          await new Promise(resolve => setTimeout(resolve, 1200));
        }

        await animateWinner(results[i], i + 1);
      }

      statusDisplay.textContent =
        results.length === 1
          ? "¡Sorteo finalizado! Este es el ganador oficial."
          : "¡Sorteo finalizado! Estos son los ganadores oficiales.";
    }

    refreshRing();

    window.addEventListener("resize", () => {
      if (!animationStarted) renderRing(ringNumbers);
    });

    const raffleRef = doc(db, "raffles", RAFFLE_ID);

    onSnapshot(
      raffleRef,
      async (snapshot) => {
        if (!snapshot.exists()) {
          statusDisplay.textContent =
            "No se encontró el sorteo.";
          return;
        }

        const raffle = snapshot.data();

        if (
          raffle.status === "drawn" &&
          Array.isArray(raffle.drawResults)
        ) {
          await showResults(raffle.drawResults);
        } else {
          statusDisplay.textContent =
            "El sorteo todavía no comenzó. Esperando el inicio oficial...";
        }
      },
      (error) => {
        console.error("Error consultando sorteo:", error);

        errorDisplay.textContent =
          "No se pudo conectar con el sorteo. Recargá la página.";
      }
    );
  </script>
</body>
</html>
